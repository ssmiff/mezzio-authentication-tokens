name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  code-style:
    name: Code style (PER-CS 3.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer cs-check

  static-analysis:
    name: Static analysis (Psalm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer static-analysis

  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
